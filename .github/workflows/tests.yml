name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  mac:
    runs-on: macos-26
    # Every run so far hung in `swift build` until GitHub's six-hour limit
    # cancelled it; a hang must not cost that again.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
