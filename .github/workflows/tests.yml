name: Tests

# Run by hand only, for now: on the macos-26 image (Xcode 26.6, Swift 6.3.3)
# one source file sends the compiler into an endless type-check, so every
# automatic run sat in `swift build` until GitHub cancelled it at six hours.
# Back to push and pull_request once that file is fixed (the diagnosis is on
# the branch ci/build_hang).
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
