# The plugin's smallest example: a window that shares a tap count and a wave
# over SharePlay. No immersive space, no engine. Regenerate the Xcode project
# from this folder with
#
#     xcodegen generate
#
# Signing: Config/Config.xcconfig composes the bundle identifier; the
# gitignored Config/Local.xcconfig holds the team (copy Local.xcconfig.example).
name: HelloShare
options:
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  deploymentTarget:
    visionOS: "26.0"
packages:
  UntoldSharePlay:
    path: ../..
schemes:
  HelloShare:
    build:
      targets:
        HelloShare: all
    run:
      config: Debug
targets:
  HelloShare:
    type: application
    platform: visionOS
    sources:
      - path: Sources/HelloShare
        excludes:
          - "Info.plist"
    dependencies:
      - package: UntoldSharePlay
        product: UntoldSharePlay
    entitlements:
      path: Sources/HelloShare/HelloShare.entitlements
      properties:
        com.apple.developer.group-session: true
    info:
      path: Sources/HelloShare/Info.plist
      properties:
        CFBundleDisplayName: Hello Share
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
    configFiles:
      Debug: Config/Config.xcconfig
      Release: Config/Config.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "7"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
